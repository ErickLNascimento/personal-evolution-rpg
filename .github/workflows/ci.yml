name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  database:
    name: Migrations, RLS e XP (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar stub do Supabase e migrations
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/sql-tests/00_supabase_stub.sql
          for f in supabase/migrations/*.sql; do
            echo "→ $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Testes de RLS e XP
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/sql-tests/10_rls_and_xp.test.sql

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Checar tipos
        run: deno check supabase/functions/*/index.ts
